services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: excel_report_backend
    restart: always
    env_file:
      - .env
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - JUDGE_MODEL=${JUDGE_MODEL:-deepseek-chat}
    ports:
      - "8008:8008"
    volumes:
      # 持久化存储数据、上传文件与导出报表到宿主机，便于宝塔面板文件管理中直接查看与下载
      - ./backend/data:/app/backend/data
      - ./backend/static/charts:/app/backend/static/charts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - excel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: excel_report_frontend
    restart: always
    ports:
      # 默认宿主机 8080 端口，避免与宝塔面板默认 Nginx 占用的 80 端口冲突
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - excel_net

networks:
  excel_net:
    driver: bridge
